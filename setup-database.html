<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setup Database SIMGURU</title>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  </head>
  <body style="font-family: system-ui; padding: 24px; background: #f2f2f7;">
    <h2>Setup Database SIMGURU</h2>
    <button id="setup-btn" style="padding: 10px 16px; border-radius: 12px; border: none; background: #007AFF; color: white; cursor: pointer;">Buat Konfigurasi Awal</button>
    <p id="status">Menunggu...</p>

    <script>
      const firebaseConfig = {
        apiKey: 'AIzaSyBe089utTbOwC6dH2ahXfJw4g_Y92jPNGU',
        authDomain: 'simsmansari.firebaseapp.com',
        projectId: 'simsmansari',
        storageBucket: 'simsmansari.firebasestorage.app',
        messagingSenderId: '436294214547',
        appId: '1:436294214547:web:81d29c588e36359ac9be66',
        measurementId: 'G-WRWWSLRP6R',
      };

      const app = firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore(app);

      document.getElementById('setup-btn').addEventListener('click', async () => {
        try {
          await db.collection('settings').doc('simguru_config').set({
            tahun_ajaran_aktif_id: '2026_2027',
            tahun_ajaran_aktif_nama: '2026/2027',
            semester_aktif_id: '2026_2027_1',
            semester_aktif_nama: 'Semester 1 (Ganjil)',
            updated_at: new Date(),
          });
          document.getElementById('status').textContent = 'Konfigurasi berhasil dibuat.';
        } catch (error) {
          document.getElementById('status').textContent = 'Gagal: ' + error.message;
        }
      });
    </script>
  </body>
</html>
