<path d="M403 263l18 18-18 18" fill="none" stroke="#89a5d1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M786 263l18 18-18 18" fill="none" stroke="#89a5d1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M1169 263l18 18-18 18" fill="none" stroke="#89a5d1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
