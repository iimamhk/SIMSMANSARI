<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">Import Materi</title><desc id="desc">Petunjuk empat langkah: Salin HTML, Tempel, Cek pratinjau, Simpan atau Publish.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef8ff"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58a8ff"/><stop offset="1" stop-color="#1769e8"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ee3a4"/><stop offset="1" stop-color="#0bbd75"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb46b"/><stop offset="1" stop-color="#ff6b1a"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#7c94b8" flood-opacity=".20"/></filter>
 <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#526b91" flood-opacity=".22"/></filter>
</defs>
<rect width="1600" height="420" rx="34" fill="url(#bg)"/>
<circle cx="20" cy="65" r="62" fill="#cfe3ff" opacity=".7"/><circle cx="1565" cy="30" r="74" fill="#c6dcff" opacity=".7"/><circle cx="1550" cy="250" r="105" fill="#c7f5dd" opacity=".65"/><circle cx="55" cy="405" r="90" fill="#ffe0c1" opacity=".75"/>
<!-- header -->
<g filter="url(#soft)"><rect x="82" y="28" width="112" height="94" rx="25" fill="#fff"/><path d="M109 69h47M109 69l16-16M109 69l16 16M164 69l-16-16M164 69l-16 16" fill="none" stroke="#2782f5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="225" y="72" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800" fill="#10245b">Import Materi</text>
<text x="225" y="104" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" fill="#63759c">Ubah konten HTML dari AI menjadi materi siap pakai, dengan langkah mudah.</text>
<g filter="url(#shadow)"><rect x="1245" y="35" width="285" height="75" rx="30" fill="#fff"/><circle cx="1285" cy="72" r="22" fill="#fff1b8"/><text x="1274" y="80" font-size="25">💡</text><text x="1315" y="65" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#142653">Dari AI ke kelas,</text><text x="1315" y="86" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#142653">lebih cepat dan praktis.</text></g>
<!-- cards -->
<g filter="url(#shadow)"><rect x="42" y="150" width="355" height="225" rx="35" fill="#eaf4ff" stroke="#d6e8ff" stroke-width="2"/></g>
<circle cx="92" cy="194" r="32" fill="url(#blue)" filter="url(#soft)"/><text x="82" y="206" font-family="Arial" font-size="32" font-weight="800" fill="#fff">1</text>
<text x="140" y="194" font-family="Inter,Arial" font-size="23" font-weight="800" fill="#112454">Salin HTML</text><text x="140" y="222" font-family="Inter,Arial" font-size="16" fill="#607295">Dari AI atau sumber Anda.</text>
<g filter="url(#soft)"><rect x="104" y="250" width="225" height="88" rx="25" fill="#fff"/><rect x="130" y="271" width="70" height="9" rx="5" fill="#c4d1e6"/><rect x="130" y="291" width="48" height="9" rx="5" fill="#5f9ef7"/><rect x="223" y="266" width="76" height="48" rx="15" fill="#e7f0ff"/><text x="239" y="298" font-family="monospace" font-size="24" font-weight="800" fill="#2879ed">&lt;/&gt;</text></g>
<g filter="url(#shadow)"><rect x="425" y="150" width="355" height="225" rx="35" fill="#f2edff" stroke="#e6ddff" stroke-width="2"/></g>
<circle cx="475" cy="194" r="32" fill="url(#purple)" filter="url(#soft)"/><text x="465" y="206" font-family="Arial" font-size="32" font-weight="800" fill="#fff">2</text>
<text x="523" y="194" font-family="Inter,Arial" font-size="23" font-weight="800" fill="#112454">Tempel</text><text x="523" y="222" font-family="Inter,Arial" font-size="16" fill="#607295">Masukkan ke kolom HTML.</text>
<g filter="url(#soft)"><rect x="500" y="255" width="205" height="78" rx="24" fill="#fff"/><rect x="530" y="276" width="140" height="36" rx="12" fill="#f4f0ff"/><rect x="544" y="286" width="4" height="18" rx="2" fill="#6d3df1"/><path d="M670 317l24 12-10-25z" fill="#7553e8"/></g>
<g filter="url(#shadow)"><rect x="808" y="150" width="355" height="225" rx="35" fill="#e8fbf1" stroke="#d3f5e4" stroke-width="2"/></g>
<circle cx="858" cy="194" r="32" fill="url(#green)" filter="url(#soft)"/><text x="848" y="206" font-family="Arial" font-size="32" font-weight="800" fill="#fff">3</text>
<text x="906" y="194" font-family="Inter,Arial" font-size="23" font-weight="800" fill="#112454">Cek pratinjau</text><text x="906" y="222" font-family="Inter,Arial" font-size="16" fill="#607295">Pastikan tampilan sudah benar.</text>
<g filter="url(#soft)"><rect x="884" y="252" width="205" height="86" rx="24" fill="#fff"/><rect x="908" y="273" width="104" height="43" rx="10" fill="#d9f5ee"/><path d="M918 306l24-22 18 15 16-12 26 19z" fill="#42c986"/><circle cx="1027" cy="292" r="30" fill="#e8f2ff" stroke="#3c83e8" stroke-width="10"/><path d="M1049 315l22 22" stroke="#245eb8" stroke-width="12" stroke-linecap="round"/></g>
<g filter="url(#shadow)"><rect x="1191" y="150" width="365" height="225" rx="35" fill="#fff0e4" stroke="#ffe1c9" stroke-width="2"/></g>
<circle cx="1241" cy="194" r="32" fill="url(#orange)" filter="url(#soft)"/><text x="1231" y="206" font-family="Arial" font-size="32" font-weight="800" fill="#fff">4</text>
<text x="1289" y="194" font-family="Inter,Arial" font-size="23" font-weight="800" fill="#112454">Simpan / Publish</text><text x="1289" y="222" font-family="Inter,Arial" font-size="16" fill="#607295">Draft atau publikasikan ke kelas.</text>
<g filter="url(#soft)"><rect x="1265" y="260" width="220" height="50" rx="20" fill="url(#blue)"/><text x="1325" y="292" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#fff">▣ Simpan</text><rect x="1280" y="320" width="190" height="40" rx="18" fill="#fff"/><text x="1314" y="346" font-family="Inter,Arial" font-size="16" font-weight="800" fill="#162858">👥 Ke Kelas</text></g>
