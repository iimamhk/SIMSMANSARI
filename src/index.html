<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SIM SMANSARI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
    <script src="https://cdn.tailwindcss.com"></link>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              iosBlue: '#007AFF',
            },
          },
        },
      };
    </script>
    <script>
      (function applyMobileViewportScale() {
        const viewportMeta = document.getElementById('viewport-meta');
        if (!viewportMeta) {
          return;
        }

        const updateViewport = () => {
          const isMobile = window.matchMedia('(max-width: 767px)').matches;
          viewportMeta.setAttribute(
            'content',
            isMobile
              ? 'width=device-width, initial-scale=0.8, viewport-fit=cover'
              : 'width=device-width, initial-scale=1.0, viewport-fit=cover'
          );
        };

        updateViewport();
        window.addEventListener('resize', updateViewport, { passive: true });
        window.addEventListener('orientationchange', updateViewport, { passive: true });
      })();
    </script>
    <style>
      :root {
        --mobile-bottom-nav-scale: 1;
        --quiz-math-display-font: 0.98rem;
        --quiz-math-inline-font: 1em;
      }

      .math-display .katex-display {
        margin: 0;
        min-width: max-content;
      }

      .math-display .katex {
        font-size: var(--quiz-math-display-font);
        line-height: 1.35;
      }

      .math-inline {
        max-width: 100%;
        vertical-align: middle;
      }

      .math-inline .katex {
        max-width: 100%;
        font-size: var(--quiz-math-inline-font);
        line-height: 1.3;
        white-space: normal;
      }

      .math-inline .base {
        white-space: nowrap;
      }

      /* Hero celestial (sun / moon) animation */
      @keyframes heroSunSpin { to { transform: rotate(360deg); } }
      @keyframes heroSunPulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.12); opacity: 0.8; } }
      @keyframes heroSunFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes heroMoonPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.95; } }
      @keyframes heroStarTwinkle { 0%, 100% { opacity: 0.15; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.2); } }

      .hero-celestial { position: absolute; pointer-events: none; z-index: 0; }
      .hero-celestial .hc-halo {
        position: absolute; inset: -36%; border-radius: 9999px;
        background: radial-gradient(circle, var(--hc-color, rgba(255, 255, 255, 0.9)) 0%, transparent 66%);
        filter: blur(9px);
        animation: heroSunPulse 4.5s ease-in-out infinite;
      }
      .hero-celestial .hc-disk {
        position: absolute; inset: 23%; border-radius: 9999px;
        background: radial-gradient(circle at 35% 30%, #fffef5, var(--hc-core, #ffd86b) 58%, var(--hc-edge, #ffb43d));
        box-shadow: 0 0 34px var(--hc-glow, rgba(255, 210, 110, 0.85));
      }
      .hero-celestial .hc-rays {
        position: absolute; inset: 0; width: 100%; height: 100%;
        transform-origin: 50% 50%;
        animation: heroSunSpin 40s linear infinite;
        color: rgba(255, 255, 255, 0.92);
      }
      .hero-celestial.hc-float { animation: heroSunFloat 6.5s ease-in-out infinite; }
      .hero-celestial.hc-moon .hc-halo {
        background: radial-gradient(circle, rgba(226, 232, 255, 0.85) 0%, transparent 64%);
        animation: heroMoonPulse 5.5s ease-in-out infinite;
      }
      .hero-celestial.hc-moon .hc-disk {
        background: radial-gradient(circle at 38% 32%, #ffffff, #e6e9ff 58%, #c7cdf5);
        box-shadow: 0 0 30px rgba(199, 205, 245, 0.7);
      }
      .hero-celestial .hc-star {
        position: absolute; border-radius: 9999px; background: #fff;
        animation: heroStarTwinkle 3.5s ease-in-out infinite;
      }
      .hero-stars { position: absolute; inset: 0; pointer-events: none; z-index: 0; }

      @keyframes qaPop { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .qa-card { animation: qaPop 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .qa-card:nth-child(1) { animation-delay: 0.03s; }
      .qa-card:nth-child(2) { animation-delay: 0.06s; }
      .qa-card:nth-child(3) { animation-delay: 0.09s; }
      .qa-card:nth-child(4) { animation-delay: 0.12s; }
      .qa-card:nth-child(5) { animation-delay: 0.15s; }
      .qa-card:nth-child(6) { animation-delay: 0.18s; }
      .qa-card:nth-child(7) { animation-delay: 0.21s; }
      .qa-card:nth-child(8) { animation-delay: 0.24s; }

      @media (max-width: 767px) {
        :root {
          --mobile-bottom-nav-scale: 0.9;
          --quiz-math-display-font: 0.86rem;
          --quiz-math-inline-font: 0.95em;
        }

        body {
          overflow-x: hidden;
        }

        .math-display {
          border-radius: 1rem;
          padding: 0.7rem 0.85rem;
        }

        .math-display .katex-display {
          text-align: left;
        }

        .math-inline {
          display: inline-flex;
          max-width: 100%;
          overflow-x: auto;
          overflow-y: hidden;
          padding-block: 0.08rem;
        }

        .math-inline::-webkit-scrollbar,
        .math-display::-webkit-scrollbar {
          height: 5px;
        }

        .math-inline::-webkit-scrollbar-thumb,
        .math-display::-webkit-scrollbar-thumb {
          background: rgba(148, 163, 184, 0.5);
          border-radius: 999px;
        }
      }

      /* ===== Student Game Premium Skin ===== */
      .sg-overlay {
        background:
          radial-gradient(120% 120% at 10% 0%, #1e1b4b 0%, transparent 55%),
          radial-gradient(120% 120% at 100% 100%, #0c4a6e 0%, transparent 55%),
          linear-gradient(135deg, #0b1120 0%, #1e1b4b 50%, #0c2a4d 100%);
      }
      .sg-blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(70px);
        opacity: 0.45;
        pointer-events: none;
        z-index: 0;
      }
      .sg-blob-1 {
        top: -12%; left: -10%;
        width: 55vw; height: 55vw;
        background: radial-gradient(circle, #6366f1 0%, transparent 70%);
        animation: sgFloat 14s ease-in-out infinite;
      }
      .sg-blob-2 {
        bottom: -18%; right: -12%;
        width: 60vw; height: 60vw;
        background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
        animation: sgFloat 18s ease-in-out infinite reverse;
      }
      .sg-blob-3 {
        top: 35%; left: 55%;
        width: 38vw; height: 38vw;
        background: radial-gradient(circle, #818cf8 0%, transparent 70%);
        animation: sgFloat 22s ease-in-out infinite;
      }
      @keyframes sgFloat {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(24px, -28px) scale(1.08); }
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        border: 1px solid rgba(255, 255, 255, 0.16);
      }

      .sg-progress-track {
        height: 9px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }
      .sg-progress-fill {
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #34d399, #22d3ee, #818cf8);
        box-shadow: 0 0 14px rgba(52, 211, 153, 0.6);
        transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .sg-question-card {
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(255, 255, 255, 0.92));
        box-shadow: 0 30px 70px -25px rgba(0, 0, 0, 0.55);
      }

      .sg-timer-pill {
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(10px);
      }
      .sg-timer-pill.is-low {
        background: rgba(244, 63, 94, 0.22);
        border-color: rgba(244, 63, 94, 0.5);
        animation: sgPulse 1s ease-in-out infinite;
      }
      @keyframes sgPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }

      .sg-nav-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 38px;
        border-radius: 14px;
        font-weight: 700;
        font-size: 0.85rem;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.12);
        color: #f1f5f9;
        transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        cursor: pointer;
      }
      .sg-nav-btn:hover {
        background: rgba(255, 255, 255, 0.24);
        transform: translateY(-2px);
      }
      .sg-nav-answered {
        background: linear-gradient(135deg, #d1fae5, #a7f3d0);
        color: #065f46;
        border-color: rgba(16, 185, 129, 0.45);
      }
      .sg-nav-current {
        background: linear-gradient(135deg, #34d399, #22d3ee);
        color: #042f2e;
        border-color: rgba(255, 255, 255, 0.5);
        box-shadow: 0 10px 24px -8px rgba(52, 211, 153, 0.85);
        transform: translateY(-2px);
      }

      .sg-choice {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 20px;
        border-radius: 20px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        background: #ffffff;
        color: #0f172a;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background 0.16s ease;
        box-shadow: 0 10px 24px -16px rgba(15, 23, 42, 0.4);
      }
      .sg-choice:hover {
        transform: translateY(-2px);
        border-color: rgba(16, 185, 129, 0.6);
        box-shadow: 0 16px 30px -14px rgba(15, 23, 42, 0.4);
      }
      .sg-choice input {
        accent-color: #10b981;
        width: 22px;
        height: 22px;
        flex: none;
      }
      .sg-choice.is-selected {
        border-color: #10b981;
        background: linear-gradient(135deg, #ecfdf5, #f0fdfa);
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.22);
      }

      .sg-input {
        width: 100%;
        border-radius: 20px;
        border: 2px solid rgba(15, 23, 42, 0.14);
        background: #ffffff;
        padding: 18px 22px;
        font-size: 1.4rem;
        font-weight: 800;
        color: #0f172a;
        letter-spacing: 0.01em;
        transition: border-color 0.16s ease, box-shadow 0.16s ease;
        box-shadow: 0 12px 26px -16px rgba(15, 23, 42, 0.35);
      }
      .sg-input:focus {
        outline: none;
        border-color: #10b981;
        box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.20), 0 12px 26px -14px rgba(16, 185, 129, 0.5);
      }

      .sg-btn {
        border-radius: 18px;
        padding: 14px 22px;
        font-size: 0.95rem;
        font-weight: 700;
        transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
        cursor: pointer;
      }
      .sg-btn:hover { transform: translateY(-2px); }
      .sg-btn:active { transform: translateY(0); }
      .sg-btn-primary {
        background: linear-gradient(135deg, #059669, #10b981);
        color: #ffffff;
        box-shadow: 0 16px 30px -12px rgba(5, 150, 105, 0.7);
      }
      .sg-btn-accent {
        background: linear-gradient(135deg, #06b6d4, #22d3ee);
        color: #053644;
        box-shadow: 0 16px 30px -12px rgba(6, 182, 212, 0.7);
      }
      .sg-btn-finish {
        background: linear-gradient(135deg, #f43f5e, #fb7185);
        color: #ffffff;
        box-shadow: 0 16px 30px -12px rgba(244, 63, 94, 0.7);
      }
      .sg-btn-ghost {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: #e2e8f0;
      }
      .sg-btn-ghost:hover { background: rgba(255, 255, 255, 0.2); }
      .sg-btn:disabled,
      .sg-btn.is-disabled {
        opacity: 0.4;
        pointer-events: none;
      }

      .sg-result-card {
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 24px 60px -25px rgba(0, 0, 0, 0.5);
      }

      @keyframes sgFadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .sg-fade-up {
        animation: sgFadeUp 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  </head>
  <body class="min-h-screen bg-[linear-gradient(145deg,_#10b981_0%,_#5eead4_28%,_#67e8f9_56%,_#93c5fd_76%,_#c4b5fd_100%)] text-slate-900 antialiased">
    <div id="app" class="min-h-screen"></div>
    <script>
      (function resolveBackendBaseUrl() {
        let storedBase = '';
        try {
          storedBase = String(window.localStorage.getItem('sim_backend_url') || '').trim();
        } catch {
          storedBase = '';
        }

        // Default ke same-origin agar deploy Vercel dan preview statis tidak bergantung
        // pada backend lokal yang belum tentu hidup. Jika ingin memaksa backend lain,
        // simpan URL-nya ke localStorage key "sim_backend_url".
        window.__SIM_BACKEND_URL__ = storedBase.replace(/\/+$/, '');
      })();
    </script>
    <script type="module" src="./firebase/firebase-config.js"></script>
    <script type="module" src="./utils/router.js"></script>
  </body>
</html>
