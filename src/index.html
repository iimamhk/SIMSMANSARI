    <script>
      (function applyMobileViewportScale() {
        const viewportMeta = document.getElementById('viewport-meta');
        if (!viewportMeta) {
          return;
        }

        const updateViewport = () => {
          const isMobile = window.matchMedia('(max-width: 767px)').matches;
          viewportMeta.setAttribute(
            'content',
            isMobile
              ? 'width=device-width, initial-scale=1.0, viewport-fit=cover'
              : 'width=device-width, initial-scale=1.0, viewport-fit=cover'
          );
        };

        updateViewport();
        window.addEventListener('resize', updateViewport, { passive: true });
        window.addEventListener('orientationchange', updateViewport, { passive: true });
      })();
    </script>

      /* Hero celestial (sun / moon) — time-aware */
      @keyframes heroSunSpin { to { transform: rotate(360deg); } }
      @keyframes heroSunPulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.12); opacity: 0.8; } }
      @keyframes heroSunFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes heroMoonPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.95; } }
      @keyframes heroStarTwinkle { 0%, 100% { opacity: 0.15; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.2); } }
      .hero-celestial { position: absolute; pointer-events: none; z-index: 0; }
      .hero-celestial .hc-halo {
        position: absolute; inset: -36%; border-radius: 9999px;
        background: radial-gradient(circle, var(--hc-color, rgba(255,255,255,0.9)) 0%, transparent 66%);
        filter: blur(9px); animation: heroSunPulse 4.5s ease-in-out infinite;
      }
      .hero-celestial .hc-disk {
        position: absolute; inset: 23%; border-radius: 9999px;
        background: radial-gradient(circle at 35% 30%, #fffef5, var(--hc-core, #ffd86b) 58%, var(--hc-edge, #ffb43d));
        box-shadow: 0 0 34px var(--hc-glow, rgba(255,210,110,0.85));
      }
      .hero-celestial .hc-rays {
        position: absolute; inset: 0; width: 100%; height: 100%;
        transform-origin: 50% 50%; animation: heroSunSpin 40s linear infinite;
        color: rgba(255,255,255,0.92);
      }
      .hero-celestial.hc-float { animation: heroSunFloat 6.5s ease-in-out infinite; }
      .hero-celestial.hc-moon .hc-halo {
        background: radial-gradient(circle, rgba(226,232,255,0.85) 0%, transparent 64%);
        animation: heroMoonPulse 5.5s ease-in-out infinite;
      }
      .hero-celestial.hc-moon .hc-disk {
        background: radial-gradient(circle at 38% 32%, #ffffff, #e6e9ff 58%, #c7cdf5);
        box-shadow: 0 0 30px rgba(199,205,245,0.7);

      .hero-celestial .hc-star {

    <script>
      (function installBootstrapErrorHandler() {
        const escapeHtml = (value) => String(value || '').replace(/[<>&]/g, (character) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[character]));
        // Pesan yang tidak boleh mematikan aplikasi: kegagalan cache/persistence
        // Firestore bersifat non-fatal karena otomatis jatuh ke memory cache.
        const isNonFatal = (error) => {
          const text = String(error?.message || error || '');
          const code = String(error?.code || '');
          return code === 'failed-precondition'
            || code === 'unimplemented'
            || /persistence layer|indexeddb|multi-tab|Failed to obtain exclusive access/i.test(text);
        };
        const showError = (error) => {
          console.error('SIM SMANSARI:', error);
          // Setelah aplikasi berhasil dimuat, error lanjutan hanya dicatat di Console.
          // Layar penuh "gagal dimuat" hanya untuk kegagalan saat bootstrap.
          if (window.__SIM_APP_READY__ === true) return;
          if (isNonFatal(error)) return;
          const message = error instanceof Error ? error.message : String(error || 'Kesalahan tidak diketahui.');
          const app = document.getElementById('app');
          if (!app || app.dataset.bootstrapError === 'true') return;
          app.dataset.bootstrapError = 'true';
          app.innerHTML = '<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f5f9;padding:24px;font-family:Arial,sans-serif"><section style="max-width:620px;width:100%;background:#fff;border:1px solid #fecdd3;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.08)"><h1 style="color:#be123c;font-size:20px;margin:0 0 8px">Aplikasi gagal dimuat</h1><p style="color:#475569;font-size:14px;margin:0 0 16px">Periksa pesan error berikut atau buka Console browser untuk detailnya.</p><pre style="white-space:pre-wrap;overflow:auto;background:#0f172a;color:#fecdd3;padding:12px;border-radius:8px;font-size:12px">' + escapeHtml(message) + '</pre><button onclick="location.reload()" style="margin-top:16px;background:#0f172a;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer">Muat ulang</button></section></main>';
        };
        window.addEventListener('error', (event) => showError(event.error || event.message));
        window.addEventListener('unhandledrejection', (event) => showError(event.reason));
      })();
    </script>
    <script>
      (function resolveBackendBaseUrl() {
        let storedBase = '';
        try {
          storedBase = String(window.localStorage.getItem('sim_backend_url') || '').trim();
        } catch {
          storedBase = '';
        }

        // Live Server (VS Code) menyajikan file statis saja — tidak ada /api/*.
        // Deteksi akses via localhost/127.0.0.1 pada port SELAIN backend (3000),
        // lalu arahkan ke server Express lokal agar login & AI tetap bekerja.
        const host = window.location.hostname;
        const port = window.location.port;
        const isLoopback = host === 'localhost' || host === '127.0.0.1';
        const isLiveServerLike = isLoopback && port && port !== '3000';
        const defaultBase = isLiveServerLike ? 'http://localhost:3000' : '';
        window.__SIM_BACKEND_URL__ = (storedBase || defaultBase).replace(/\/+$/, '');
      })();
    </script>
    <script type="module" src="./firebase/firebase-config.js"></script>

    <script>
      // Registrasi Service Worker (PWA). Hanya di konteks aman (HTTPS/localhost).
      // Live Server di port 5500 memakai API production, tapi SW tetap di-skip di sana
      // agar caching lokal tidak mengganggu pengembangan.
      (function registerServiceWorker() {
        if (!('serviceWorker' in navigator)) return;
        const isDevLiveServer = window.location.port === '5500';
        if (isDevLiveServer) return;

        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((registration) => {
              // Saat versi baru siap, aktifkan segera lalu reload sekali.
              registration.addEventListener('updatefound', () => {
                const installing = registration.installing;
                if (!installing) return;
                installing.addEventListener('statechange', () => {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    registration.waiting?.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch((error) => console.warn('SW registration gagal:', error));

          let reloadedForUpdate = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloadedForUpdate) return;
            reloadedForUpdate = true;
            window.location.reload();
          });
        });
      })();
    </script>
