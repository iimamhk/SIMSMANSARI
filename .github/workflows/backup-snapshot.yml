name: Backup Mingguan

# Cadangan otomatis HASIL KERJA GURU: absensi, nilai, dan keaktifan siswa,
# beserta koleksi kunci yang diperlukan untuk membacanya (pengajaran, anggota
# kelas, bab, tugas, kolom ulangan, dan nama periode/kelas/mapel).
#
# Menghasilkan DUA jenis berkas dari satu kali pembacaan data:
#   1. Snapshot .json.gz  -> untuk MEMULIHKAN data ke sistem (dipakai admin)
#   2. Excel per guru     -> untuk DILANJUTKAN langsung di Excel oleh guru
#                            bila aplikasi tidak dapat diakses
#
# Excel dibuat dari data yang sudah di memori, jadi tidak menambah satu pun
# operasi baca Firestore.
#
# TIDAK dicadangkan: kuis, permainan, percakapan, materi ajar, keuangan, tampilan
# lobi, serta `users` dan `settings` karena keduanya memuat kredensial.
#
# Dijalankan Sabtu 18:00 UTC = MINGGU 01:00 WIB.
#
# Mengapa Minggu dini hari: pembacaan data memakai kuota Firestore, dan paket
# gratis hanya memberi 50.000 operasi baca per hari yang dipakai bersama seluruh
# pengguna. Pada hari Minggu tidak ada kegiatan mengajar, sehingga kuota hari itu
# memang sedang tidak terpakai.
#
# Pembagian tanggung jawab:
#   Admin (workflow ini) -> cadangan otomatis untuk seluruh guru
#   Guru (halaman Backup) -> ekspor Excel mandiri, maksimal satu kali per minggu
#
# Catatan: GitHub menonaktifkan jadwal otomatis bila repository tidak ada
# aktivitas selama 60 hari. Bila libur panjang, jalankan sekali secara manual
# lewat tombol "Run workflow" agar jadwalnya tetap hidup.
on:
  schedule:
    - cron: '0 18 * * 6'
  workflow_dispatch:
    inputs:
      skip_drive:
        description: 'Lewati unggah ke Google Drive (hanya lampirkan ke Release)'
        type: boolean
        default: false
      skip_excel:
        description: 'Lewati pembuatan Excel per guru (hanya snapshot JSON)'
        type: boolean
        default: false
      extra_collections:
        description: 'Koleksi tambahan di luar cakupan, dipisah koma (mis. catatan_khusus,jurnal_guru)'
        default: ''
      max_reads:
        description: 'Batas operasi baca Firestore'
        default: '45000'

env:
  # Node 22+ dipilih bukan sekadar mengikuti versi terbaru: scripts/ berupa
  # CommonJS sedangkan src/utils/ berupa ES module, dan jembatannya adalah
  # dynamic import(). Node 20 pernah membuat pembuatan Excel gagal senyap di sini.
  # src/utils/package.json sudah menyatakan "type":"module" sebagai pengaman utama,
  # dan versi Node ini menjadi lapis keduanya.
  NODE_VERSION: '22'

# Cegah dua snapshot berjalan bersamaan — kuota baca akan terpakai dua kali.
concurrency:
  group: backup-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pasang dependensi
        run: npm ci --omit=dev

      - name: Periksa secret yang diperlukan
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_JSON belum diisi."
            echo "Buka Settings > Secrets and variables > Actions, lalu tambahkan secret tersebut"
            echo "berisi seluruh isi berkas JSON service account Firebase."
            exit 1
          fi
          echo "FIREBASE_SERVICE_ACCOUNT_JSON: tersedia."
          if [ -n "${{ secrets.AI_CONFIG_SECRET }}" ]; then
            echo "AI_CONFIG_SECRET: tersedia."
          elif [ -n "${{ secrets.FIREBASE_PRIVATE_KEY }}" ]; then
            echo "FIREBASE_PRIVATE_KEY: tersedia (dipakai sebagai kunci dekripsi kredensial Drive)."
          else
            echo "::warning::Tidak ada AI_CONFIG_SECRET maupun FIREBASE_PRIVATE_KEY."
            echo "Snapshot tetap berjalan dan dilampirkan ke Release, tetapi kredensial Google"
            echo "Drive kemungkinan tidak dapat didekripsi sehingga salinan ke Drive dilewati."
            echo "Perbaikan: tambahkan secret FIREBASE_PRIVATE_KEY dengan nilai yang sama"
            echo "seperti yang dipakai aplikasi web (Vercel)."
          fi

      - name: Jalankan backup hasil kerja guru
        id: snapshot
        run: node scripts/backup-snapshot.js
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # Dipakai HANYA untuk menurunkan kunci dekripsi kredensial Google Drive,
          # bukan untuk autentikasi Firebase (itu memakai service account JSON di
          # atas). Nilainya harus sama dengan yang dipakai aplikasi web, karena
          # kredensial Drive dienkripsi di sana.
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          AI_CONFIG_SECRET: ${{ secrets.AI_CONFIG_SECRET }}
          BACKUP_MAX_READS: ${{ inputs.max_reads || '45000' }}
          BACKUP_SKIP_DRIVE: ${{ inputs.skip_drive && '1' || '0' }}
          BACKUP_SKIP_EXCEL: ${{ inputs.skip_excel && '1' || '0' }}
          BACKUP_EXTRA_COLLECTIONS: ${{ inputs.extra_collections || '' }}

      # Lampiran Release berfungsi sebagai salinan kedua di luar Google Drive,
      # sesuai prinsip "jangan simpan semua cadangan di satu tempat".
      - name: Lampirkan hasil backup ke GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup-${{ github.run_number }}
          name: Backup Mingguan ${{ github.run_number }}
          body: |
            Cadangan otomatis data hasil kerja guru.

            **Dua jenis berkas, dua kegunaan berbeda:**

            | Berkas | Untuk siapa | Kegunaan |
            | --- | --- | --- |
            | `Snapshot-*.json.gz` | Admin | Memulihkan data ke sistem. Memuat setiap dokumen beserta ID Firestore-nya. |
            | `Backup-<Nama Guru>-*.xlsx` | Guru | Dibuka dan dilanjutkan langsung di Excel bila aplikasi tidak dapat diakses. |

            Setiap berkas Excel berisi sheet Petunjuk, lalu untuk tiap kelas yang
            diampu ada 4 sheet: Rekap Absen, Absen Harian, Nilai, dan Keaktifan.
            Seluruh total, persentase, nilai akhir, grade, dan predikat berupa
            rumus Excel yang menghitung ulang sendiri bila datanya disunting.

            **Isi:** absensi, nilai tugas, nilai ujian, dan keaktifan siswa,
            beserta koleksi kunci untuk membacanya (pengajaran, anggota kelas,
            bab, tugas, kolom ulangan harian, tahun ajaran, kelas, mata pelajaran).

            **Tidak termasuk:** kuis, permainan, percakapan, materi ajar,
            keuangan, tampilan lobi, serta `users` dan `settings` karena keduanya
            memuat kredensial.

            Untuk membuka snapshot JSON:

                gunzip -c Snapshot-*.json.gz > snapshot.json
          files: |
            Snapshot-SIMSMANSARI-*.json.gz
            Backup-*.xlsx
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Laporkan kegagalan
        if: failure()
        run: |
          echo "::error::Snapshot backup mingguan GAGAL."
          echo "Log lengkap: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Periksa: (1) secret FIREBASE_SERVICE_ACCOUNT_JSON, (2) apakah batas baca tercapai."
          exit 1
