name: Backup Mingguan Google Drive

on:
  schedule:
    # Runs every Sunday at 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allows manual triggering from GitHub Actions UI

env:
  NODE_VERSION: '20'
  TAHUN_AJARAN_AKTIF: '2026_2027'
  SEMESTER_AKTIF: '2026_2027_1'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm install

    - name: Validate required secrets
      run: |
        if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
          echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set"
          exit 1
        fi
        if [ -z "${{ secrets.GOOGLE_SA_KEY }}" ]; then
          echo "::warning::GOOGLE_SA_KEY is not set, will use FIREBASE_SERVICE_ACCOUNT_JSON"
        fi
        if [ -z "${{ secrets.BACKUP_FOLDER_ID }}" ]; then
          echo "::error::BACKUP_FOLDER_ID is not set. Set it to a folder shared with the service account."
          exit 1
        fi
        if [ -z "${{ secrets.BACKUP_SHARE_EMAIL }}" ]; then
          echo "::warning::BACKUP_SHARE_EMAIL is not set; folder links will only be available to the service account."
        fi
        echo "All required checks passed."

    - name: Run backup script
      id: backup
      run: node scripts/backup-to-drive.js
      env:
        FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        BACKUP_FOLDER_ID: ${{ secrets.BACKUP_FOLDER_ID }}
        BACKUP_SHARE_EMAIL: ${{ secrets.BACKUP_SHARE_EMAIL }}
        TAHUN_AJARAN_AKTIF: ${{ secrets.TAHUN_AJARAN_AKTIF || env.TAHUN_AJARAN_AKTIF }}
        SEMESTER_AKTIF: ${{ secrets.SEMESTER_AKTIF || env.SEMESTER_AKTIF }}

    - name: Send notification on failure
      if: failure()
      run: |
        echo "::error::Backup mingguan GAGAL! Periksa logs GitHub Actions untuk detail."
        echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
