name: Backup Mingguan Excel

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  TAHUN_AJARAN_AKTIF: '2026_2027'
  SEMESTER_AKTIF: '2026_2027_1'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm install

    - name: Validate required secrets
      run: |
        if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
          echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set"
          exit 1
        fi
        if [ -z "${{ env.TAHUN_AJARAN_AKTIF }}" ]; then
          echo "::error::TAHUN_AJARAN_AKTIF is not set"
          exit 1
        fi
        if [ -z "${{ env.SEMESTER_AKTIF }}" ]; then
          echo "::error::SEMESTER_AKTIF is not set"
          exit 1
        fi
        echo "All required checks passed."

    - name: Run Excel backup script
      id: backup
      run: node scripts/backup-excel.js
      env:
        FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        TAHUN_AJARAN_AKTIF: ${{ secrets.TAHUN_AJARAN_AKTIF || env.TAHUN_AJARAN_AKTIF }}
        SEMESTER_AKTIF: ${{ secrets.SEMESTER_AKTIF || env.SEMESTER_AKTIF }}

    - name: Upload backup to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: backup-${{ github.run_number }}
        name: Backup ${{ github.event.head_commit.message || 'Mingguan' }}
        files: Laporan-SIMSMANSARI-*.xlsx
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send notification on failure
      if: failure()
      run: |
        echo "::error::Backup mingguan GAGAL! Periksa logs GitHub Actions untuk detail."
        echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"