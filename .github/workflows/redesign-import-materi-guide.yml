name: Redesign import materi guide
on:
  push:
    paths:
      - '.github/workflows/redesign-import-materi-guide.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply redesign
        run: python .github/scripts/redesign_import_materi.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/guru/materi-import.js
          git diff --cached --check
          git commit -m "style: simplify import materi guide"
          git push origin main
