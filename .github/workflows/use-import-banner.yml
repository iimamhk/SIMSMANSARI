name: Use import materi banner
on:
  push:
    paths:
      - '.github/workflows/use-import-banner.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace guide with banner
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/pages/guru/materi-import.js')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"\n    \.mi-guide \{.*?@media \(max-width:480px\) \{ \.mi-guide \{ padding:12px; \} \.mi-guide-head \{ align-items:flex-start; \} \.mi-guide-note \{ white-space:normal; text-align:right; \} \.mi-steps \{ grid-template-columns:1fr; \} \.mi-step::after \{ display:none; \} \}\n", "\n    .mi-guide-banner { display:block; width:100%; height:auto; margin-top:12px; border-radius:18px; box-shadow:0 14px 34px -26px rgba(15,23,42,.35); }\n    @media (max-width:640px) { .mi-guide-banner { border-radius:12px; margin-top:10px; } }\n", s, count=1, flags=re.S)
          if n!=1: raise SystemExit(f'guide CSS replacement failed: {n}')
          old='''    <section class="mi-guide" aria-label="Cara import materi">\n      <div class="mi-guide-head">\n        <h2 class="mi-guide-title">Cara import materi</h2>\n        <span class="mi-guide-note">4 langkah cepat</span>\n      </div>\n      <div class="mi-steps">\n        <div class="mi-step"><span class="mi-step-no">1</span><strong>Salin HTML</strong><span>Dari AI atau sumber Anda.</span></div>\n        <div class="mi-step"><span class="mi-step-no">2</span><strong>Tempel</strong><span>Masukkan ke kolom HTML.</span></div>\n        <div class="mi-step"><span class="mi-step-no">3</span><strong>Cek pratinjau</strong><span>Pastikan tampilan sudah benar.</span></div>\n        <div class="mi-step"><span class="mi-step-no">4</span><strong>Simpan / Publish</strong><span>Simpan draft atau kirim ke kelas.</span></div>\n      </div>\n    </section>'''
          new='''    ${editMode ? '' : '<img class="mi-guide-banner" src="/assets/import-materi-guide.svg" alt="Petunjuk Import Materi: Salin HTML, Tempel, Cek pratinjau, lalu Simpan atau Publish ke kelas." loading="eager">'}'''
          if s.count(old)!=1: raise SystemExit(f'guide HTML replacement failed: {s.count(old)}')
          s=s.replace(old,new,1)
          if 'class="mi-guide"' in s or 'mi-step-no' in s: raise SystemExit('old guide remains')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/guru/materi-import.js
          git diff --cached --check
          git commit -m "style: replace import guide with banner"
          git push origin main
